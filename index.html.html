-<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eco ID Card · 3D Simulator</title>
<style>
:root{--bg:#050805;--g:#22c55e;--g2:#86efac;--tx:#e8fff0;--mut:#7fa58c;--pan:#0b120d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;position:relative}
canvas#bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
header{z-index:2;padding:10px 16px 0;display:flex;justify-content:space-between;align-items:center}
h1{font-size:15px;margin:0;letter-spacing:.14em;text-transform:uppercase;color:var(--g2)}
h1 small{display:block;color:var(--mut);letter-spacing:.04em;text-transform:none;font-size:11px;margin-top:2px}
.btns{display:flex;gap:6px}
button{background:#0d1a11;color:var(--g2);border:1px solid #1d4d2c;border-radius:20px;padding:7px 12px;font-size:12px;cursor:pointer}
button.on{background:var(--g);color:#031;border-color:var(--g)}
#scene{flex:1;position:relative;z-index:1;perspective:1100px;touch-action:none;cursor:grab;min-height:0;overflow:hidden}
#scene:active{cursor:grabbing}
#hint{position:absolute;top:6px;width:100%;text-align:center;font-size:11px;color:var(--mut);pointer-events:none}
#shadow{position:absolute;left:50%;bottom:4%;width:190px;height:26px;margin-left:-95px;border-radius:50%;background:radial-gradient(closest-side,rgba(34,197,94,.45),transparent);animation:sh 4s ease-in-out infinite}
@keyframes sh{50%{transform:scale(.7);opacity:.5}}
#float{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transform:scale(var(--s,1));animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:scale(var(--s,1)) translateY(-8px)}50%{transform:scale(var(--s,1)) translateY(10px)}}
#stage{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.L{position:absolute;left:-108px;top:-172px;width:216px;height:344px;transform-style:preserve-3d;pointer-events:none;transform:translateZ(calc(var(--e)*var(--z)*1px))}
.L>*{pointer-events:auto}
.f{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.base{inset:0;border-radius:14px;background:
radial-gradient(circle at 20% 15%,rgba(255,255,255,.18),transparent 45%),
repeating-radial-gradient(circle at 70% 60%,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),
linear-gradient(160deg,#16a34a,#22c55e 55%,#15803d);box-shadow:0 0 30px rgba(34,197,94,.45),inset 0 0 0 1px rgba(255,255,255,.25)}
.back{transform:rotateY(180deg)}
.back.base{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#042a12;text-align:center;font-size:12px;font-weight:700;padding:20px}
.hole{position:absolute;left:84px;top:14px;width:48px;height:10px;border-radius:6px;background:#050805;box-shadow:inset 0 2px 3px #000}
.ink span{position:absolute;left:18px;color:#021a0a}
.ink .a{top:96px;font-size:10px;letter-spacing:.2em;font-weight:700}
.ink .n{top:118px;font-size:21px;font-weight:800;line-height:1.05;width:180px}
.ink .id{top:190px;font:700 12px ui-monospace,monospace}
.band{left:0;top:48px;width:216px;height:34px;background:#d9f99d;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:.3em;color:#14532d;box-shadow:0 0 14px rgba(190,242,100,.6)}
.qr{left:66px;top:226px;width:84px;height:84px;background:#f1fff5;padding:5px;border-radius:5px;display:grid;grid-template-columns:repeat(15,1fr);box-shadow:0 0 16px rgba(255,255,255,.5)}
.qr i{background:#031}.qr i.o{background:transparent}
.strap{width:24px;height:230px;left:96px;top:-210px;transform-origin:50% 100%;background:repeating-linear-gradient(0deg,#a8845a 0 3px,#8a6a43 3px 6px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.clip{left:92px;top:2px;width:32px;height:24px;border:3px solid #cfd8d3;border-radius:6px;background:transparent}
.cube{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.cube .face{position:absolute;left:-45px;top:-45px;width:90px;height:90px;border:2px solid var(--g);background:rgba(34,197,94,.16);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--g2);letter-spacing:.1em;backface-visibility:visible}
.sel .base,.sel.f,.sel>.f{outline:2px solid #fff;outline-offset:2px}
.sel .face{background:rgba(34,197,94,.45)}
#boxw{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform:translate3d(calc(var(--e)*150px),calc(260px + var(--e)*30px),calc(var(--e)*60px));}
#panel{z-index:2;background:linear-gradient(#0b120dee,#050805);border-top:1px solid #153a22;padding:10px 14px 12px;max-height:42%;overflow:auto}
#chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
#chips button{white-space:nowrap;flex:none}
#info h2{margin:2px 0 4px;font-size:16px;color:var(--g2)}
#info p{margin:3px 0;font-size:13px;line-height:1.4;color:#cfe8d8}
#info b{color:var(--g)}
.row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;color:var(--mut)}
input[type=range]{flex:1;accent-color:var(--g)}
</style></head>
<body><div id="app">
<canvas id="bg"></canvas>
<header><h1>Eco ID Card<small>3D simulator · drag to rotate, tap a part</small></h1>
<div class="btns"><button id="bSpin" class="on">Spin</button><button id="bGrav" class="on">Zero-G</button></div></header>
<div id="scene"><div id="hint">Drag with your finger · tap floating parts</div><div id="shadow"></div>
<div id="float"><div id="stage"></div></div></div>
<div id="panel">
<div class="row">Assemble<input id="ex" type="range" min="0" max="1" step="0.01" value="0.75">Explode</div>
<div id="chips"></div><div id="info"></div></div></div>
<script>
const P=[
{n:"Card Body",m:"Recycled card stock, 250–300 GSM",s:"54 × 86 mm portrait · about 0.35 mm thick",f:"Main plastic-free carrier of the pass. Stiff enough to wear for 4+ hours, and can be recycled after the event."},
{n:"Eco Ink Print",m:"Digital print, water- or soy-based eco ink",s:"Name, role and ID number (e.g. EV-0001)",f:"Shows who the person is, readable from about 1 m. No harsh solvents, so the paper stays recyclable."},
{n:"Role Colour Band",m:"Eco ink band on the recycled card",s:"Colour-coded: organizer, volunteer, guest…",f:"Lets staff tell roles apart from 3 m away without reading the text."},
{n:"QR Code",m:"Free online QR generator, printed in eco ink",s:"Scanned with any phone, 10 test scans planned",f:"Entry check: scan it and the right ID shows up. Keeps entry secure and quick, no special hardware."},
{n:"Jute / Cotton Lanyard",m:"Natural jute or cotton fibre",s:"Hole and lanyard must hold a 200 g weight for 1 min · about ₹10",f:"Holds the card around the neck. Replaces plastic lanyards, so the whole pass is plastic-free."},
{n:"Collection Box",m:"Recycled cardboard box (about ₹100, shared by 200 cards)",s:"Placed at the exit",f:"Cards are returned and sorted here for recycling or reuse. Return rate is counted in testing."},
{n:"Back Face",m:"Same recycled card stock",s:"“Made from recycled paper · Return at the exit box”",f:"Reminds the wearer to return the card, closing the loop."}];
const Z=[0,45,90,135,185,0,-85];
const st=document.getElementById('stage');
let h='';
// back
h+=`<div class="L" data-i="6" style="--z:${Z[6]}"><div class="f base back"><div style="font-size:30px">♻</div>Made from<br>recycled paper<br><span style="font-weight:500">Return at the exit box</span><div style="font:700 11px ui-monospace;margin-top:6px">SCAN FOR ENTRY</div></div></div>`;
h+=`<div class="L" data-i="0" style="--z:0"><div class="f base"><div class="hole"></div></div></div>`;
h+=`<div class="L ink" data-i="1" style="--z:${Z[1]}"><span class="f a">ECO PASS</span><span class="f n">AJAI BALA K.</span><span class="f id">ID: EV-0001</span></div>`;
h+=`<div class="L" data-i="2" style="--z:${Z[2]}"><div class="f band">ORGANIZER</div></div>`;
let q='';const A=15;for(let r=0;r<A;r++)for(let c=0;c<A;c++){const fd=(r<5&&c<5)||(r<5&&c>9)||(r>9&&c<5);let on;if(fd){const rr=r%10,cc=c>9?c-10:c;on=(rr==0||rr==4||cc==0||cc==4||(rr>1&&rr<3&&cc>1&&cc<3))}else on=((r*7+c*13+r*c)%5<2);q+=`<i class="${on?'':'o'}"></i>`}
h+=`<div class="L" data-i="3" style="--z:${Z[3]}"><div class="f qr">${q}</div></div>`;
h+=`<div class="L" data-i="4" style="--z:${Z[4]}"><div class="f strap" style="transform:rotate(9deg)"></div><div class="f strap" style="transform:rotate(-9deg)"></div><div class="f clip"></div></div>`;
st.innerHTML=h+`<div id="boxw" data-i="5"><div class="cube" id="cube">
<div class="face" style="transform:translateZ(45px)">RETURN</div><div class="face" style="transform:rotateY(180deg) translateZ(45px)">BOX</div>
<div class="face" style="transform:rotateY(90deg) translateZ(45px)">♻</div><div class="face" style="transform:rotateY(-90deg) translateZ(45px)">♻</div>
<div class="face" style="transform:rotateX(90deg) translateZ(45px)"></div><div class="face" style="transform:rotateX(-90deg) translateZ(45px)">SLOT</div></div></div>`;
const $=id=>document.getElementById(id);
const root=document.documentElement,sc=$('scene');
function ex(){root.style.setProperty('--e',$('ex').value)}
$('ex').oninput=ex;ex();
function fit(){const r=sc.getBoundingClientRect();root.style.setProperty('--s',Math.min(r.width/430,r.height/700).toFixed(3))}
addEventListener('resize',fit);fit();setTimeout(fit,300);
// chips + info
const ch=$('chips');P.slice(0,6).forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.n;b.onclick=()=>pick(i);ch.appendChild(b)});
function pick(i){
document.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));
document.querySelectorAll(`[data-i="${i}"]`).forEach(e=>e.classList.add('sel'));
[...ch.children].forEach((b,k)=>b.classList.toggle('on',k===i));
const p=P[i];$('info').innerHTML=`<h2>${p.n}</h2><p><b>Material:</b> ${p.m}</p><p><b>Details:</b> ${p.s}</p><p><b>What it does:</b> ${p.f}</p>`}
$('info').innerHTML='<h2>Eco-Friendly Temporary ID Card</h2><p>A plastic-free event pass: recycled card, eco ink, QR entry check, jute lanyard and a return box. Tap any floating part to learn what it is made of and what it does. Slide to explode the layers.</p>';
// rotation
let rx=-12,ry=-28,vx=0,vy=0,drag=false,lx,ly,moved=0,spin=true,grav=true;
sc.addEventListener('pointerdown',e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;sc.setPointerCapture(e.pointerId)});
sc.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);vy=dx*.5;vx=-dy*.4;ry+=vy;rx=Math.max(-80,Math.min(80,rx+vx))});
sc.addEventListener('pointerup',e=>{drag=false;if(moved<8){const t=document.elementFromPoint(e.clientX,e.clientY);const d=t&&t.closest('[data-i]');if(d)pick(+d.dataset.i)}$('hint').style.opacity=0});
$('bSpin').onclick=e=>{spin=!spin;e.target.classList.toggle('on',spin)};
$('bGrav').onclick=e=>{grav=!grav;e.target.classList.toggle('on',grav);$('float').style.animationPlayState=grav?'running':'paused';$('shadow').style.animationPlayState=grav?'running':'paused'};
let cr=0;
(function loop(){if(!drag){ry+=vy;rx=Math.max(-80,Math.min(80,rx+vx));vy*=.95;vx*=.95;if(spin&&Math.abs(vy)<.1)ry+=.35}
st.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;cr+=.8;$('cube').style.transform=`rotateY(${cr}deg) rotateX(-15deg)`;requestAnimationFrame(loop)})();
// antigravity particles
const cv=$('bg'),cx=cv.getContext('2d');let W,H,pts=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<60;i++)pts.push({x:Math.random(),y:Math.random(),r:Math.random()*2+.5,v:Math.random()*.0006+.0002});
(function dr(){cx.clearRect(0,0,W,H);for(const p of pts){p.y-=p.v*(grav?1:.1);if(p.y<0){p.y=1;p.x=Math.random()}cx.beginPath();cx.fillStyle=`rgba(74,222,128,${.15+p.r*.15})`;cx.arc(p.x*W,p.y*H,p.r,0,7);cx.fill()}requestAnimationFrame(dr)})();
</script></body></html>
